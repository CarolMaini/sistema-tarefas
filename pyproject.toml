[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-tarefas"
version = "0.1.0"
description = "Organizador de Tarefas — foundation phase"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==6.1.2",
  "django-allauth[socialaccount]==65.19.7",
  "psycopg[binary]>=3.2.1,<4.0",
  "celery>=5.4.0,<6.0",
  "redis>=5.0.0,<6.0",
  "python-dotenv>=1.0.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-django>=4.8.0,<5.0",
  "ruff>=0.6.0,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "setup.settings.local"
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
